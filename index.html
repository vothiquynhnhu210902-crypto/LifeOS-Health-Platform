<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>LifeOS Health Platform</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <!-- HEADER -->

    <header>

        <h1>🩺 LifeOS</h1>

        <p>Health Management Platform</p>

    </header>


    <main>

        <!-- ========================= -->
        <!-- TRA CỨU BỆNH NHÂN -->
        <!-- ========================= -->

        <section class="card">

            <h2>
                🔎 Tra cứu bệnh nhân
            </h2>

            <div class="search-box">

                <input
                    type="text"
                    id="patientCode"
                    placeholder="Nhập mã bệnh nhân, ví dụ BN001">

                <button onclick="searchPatient()">
                    Tra cứu
                </button>

            </div>

        </section>


        <!-- ========================= -->
        <!-- THÊM BỆNH NHÂN -->
        <!-- ========================= -->

        <section class="card">

            <h2>
                ➕ Thêm bệnh nhân
            </h2>

            <div class="patient-form">

                <input
                    type="text"
                    id="newCode"
                    placeholder="Mã bệnh nhân">

                <input
                    type="text"
                    id="newName"
                    placeholder="Họ và tên">

                <input
                    type="number"
                    id="newAge"
                    placeholder="Tuổi">

                <input
                    type="text"
                    id="newPhone"
                    placeholder="Số điện thoại">

                <input
                    type="text"
                    id="newVisitDate"
                    placeholder="Ngày khám: DD/MM/YYYY">

                <input
                    type="text"
                    id="newFollowDate"
                    placeholder="Ngày tái khám: DD/MM/YYYY">

                <input
                    type="text"
                    id="newBloodPressure"
                    placeholder="Huyết áp, ví dụ 120/80">

                <input
                    type="number"
                    id="newHeartRate"
                    placeholder="Nhịp tim">

                <input
                    type="number"
                    step="0.1"
                    id="newTemperature"
                    placeholder="Nhiệt độ">

                <input
                    type="text"
                    id="newNote"
                    placeholder="Ghi chú">

            </div>


            <button onclick="addPatient()">

                💾 Lưu bệnh nhân

            </button>

        </section>


        <!-- ========================= -->
        <!-- HỒ SƠ BỆNH NHÂN -->
        <!-- ========================= -->

        <section
            id="patientSection"
            class="card hidden">

            <h2>
                👤 Hồ sơ bệnh nhân
            </h2>

            <div id="patientInfo"></div>


            <button
                class="ai-button"
                onclick="analyzePatient()">

                🤖 Phân tích bằng AI

            </button>

        </section>


        <!-- ========================= -->
        <!-- AI -->
        <!-- ========================= -->

        <section
            id="aiSection"
            class="card hidden">

            <h2>
                🤖 AI Health Assistant
            </h2>

            <div id="aiResult"></div>

        </section>


    </main>


    <script src="script.js"></script>

</body>

</html>
